[package]
name = "mihomosh"
version = "3.0.0"
edition = "2024"
description = "A command line toolkit for Mihomo"
repository = "https://github.com/SamuNatsu/mihomosh"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
askama = "0.16.0"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
color-eyre = "0.6.5"
comfy-table = { version = "7.2.2", features = ["custom_styling"] }
directories = "6.0.0"
eyre = "0.6.12"
owo-colors = "4.3.0"
rand = "0.10.1"
reqwest = "0.13.4"
sea-orm = { version = "2.0.0-rc.38", features = ["sqlx-sqlite", "runtime-tokio", "schema-sync"] }
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "0.0.26", features = ["validator"] }
serde_json = "1.0.149"
serde_trim = "1.1.0"
smart-default = "0.7.1"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread"] }
url = { version = "2.5.8", features = ["serde"] }
validator = { version = "0.20.0", features = ["derive"] }
