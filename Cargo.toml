[package]
name = "mihomosh"
version = "3.0.0"
edition = "2024"
description = "A command line toolkit for Mihomo"
repository = "https://github.com/SamuNatsu/mihomosh"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.3"
sea-orm = { version = "2.0.0-rc.38", features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["macros"] }
url = { version = "2.5.8", features = ["serde"] }
