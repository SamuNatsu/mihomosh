[package]
name = "mihomosh"
version = "2.1.0"
edition = "2024"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.98"
boa_engine = "0.20.0"
boa_runtime = "0.20.0"
bytes = "1.10.1"
chrono = "0.4.41"
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4.5.54"
console = "0.16.0"
directories = "6.0.0"
futures = "0.3.31"
hex = "0.4.3"
rand = "0.9.1"
reqwest = { version = "0.12.22", default-features = false, features = [
    "charset",
    "json",
    "rustls-tls",
    "system-proxy",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yml = "0.0.12"
tempfile = "3.20.0"
tokio = { version = "1.46.1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
] }
unicode-width = "0.2.1"
url = { version = "2.5.4", features = ["serde"] }
urlencoding = "2.1.3"
wildcard = "0.3.0"
