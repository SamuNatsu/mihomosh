[package]
name = "mihomosh"
version = "2.0.0"
edition = "2024"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
clap_complete = "4.5.54"
console = "0.16.0"
directories = "6.0.0"
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yml = "0.0.12"
tempfile = "3.20.0"
urlencoding = "2.1.3"

